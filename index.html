<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="龙之城重置 · 三元素卡牌对战：我方三人对敌方三人轮流出招，技能属性克制决定 1.5 倍 / 1 倍 / 0.5 倍伤害。">
<title>龙之城重置 · 卡牌对战</title>
<style>
  /* 首屏关键样式：即使外部样式表尚未就绪也有可读内容 */
  html, body { height: 100%; margin: 0; background: #000; }
  body { overflow: hidden; color: #fff2d6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .boot {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    z-index: 20;
    display: grid; place-items: center;
    background: #46021c;
    text-align: center;
  }
  .boot-title { font-size: 16px; letter-spacing: 4px; color: #ffbf29; }
  .boot-sub { margin-top: 6px; font-size: 10px; color: #ffd9a8; letter-spacing: 1px; }
</style>
<link rel="stylesheet" href="./styles/pixel.css?v=15">
</head>
<body>
<!-- 2:1 固定比例的游戏画面：等比缩放到窗口里，剩下的地方全部填黑 -->
<div class="fit" id="fit">
  <div class="stage" id="stage">
    <!-- 边框终稿：铺满整个画面，所有内容都对齐到它的镂空区域 -->
    <div class="frame-art" aria-hidden="true"></div>

    <!-- JS 就绪前的首屏（build 时会被移除） -->
    <div class="boot" id="boot" role="status" aria-live="polite">
      <div class="boot-title">龙之城重置</div>
      <div class="boot-sub">回合制卡牌对战 · 准备中…</div>
    </div>

    <section class="side side-ally" id="allySide"></section>

    <section class="center">
      <div class="log-wrap">
        <div class="log-head">
          <span class="hud-round">回合 <b id="roundNum">1</b>　击杀 <b id="killNum">0</b></span>
          <div class="hud-order" id="orderBar"></div>
          <span class="cards-hint" id="cardsHint">准备中…</span>
          <div class="hud-btns">
            <button id="btnFull" class="px-btn">全屏</button>
            <button id="btnSound" class="px-btn">音效 开</button>
            <button id="btnRestart" class="px-btn">重开</button>
          </div>
        </div>
        <div class="log" id="log"></div>
      </div>

      <div class="cards-wrap">
        <div class="cards" id="cards"></div>
      </div>
    </section>

    <section class="side side-enemy" id="enemySide"></section>

    <!-- 飘字与结算层放在 stage 内，竖屏旋转时跟着一起转 -->
    <div id="fxLayer"></div>
    <div id="overlay" class="overlay hidden"></div>

    <!-- ================= 主界面 ================= -->
    <!-- 整张「游戏主界面」直接当底图，三个透明按钮压在对应位置 -->
    <section class="screen menu-screen" id="menuScreen">
      <img class="menu-bg" src="./assets/menu.png" alt="龙之城 主界面">
      <button type="button" class="menu-dragon left" id="menuDragonL" tabindex="-1" aria-hidden="true"></button>
      <button type="button" class="menu-dragon right" id="menuDragonR" tabindex="-1" aria-hidden="true"></button>
      <div class="px-confirm hidden" id="resetConfirm">
        <div class="px-confirm-box">
          <div class="px-confirm-title">请输入指令</div>
          <input type="text" class="egg-input" id="eggInput" maxlength="8" autocomplete="off">
          <div class="px-confirm-btns">
            <button type="button" class="px-btn big" id="eggOk">确认</button>
            <button type="button" class="px-btn big" id="eggCancel">取消</button>
          </div>
        </div>
      </div>
      <button type="button" class="menu-hit" id="menuFight" aria-label="战斗"></button>
      <button type="button" class="menu-hit" id="menuManage" aria-label="管理"></button>
      <button type="button" class="menu-hit" id="menuGuide" aria-label="图鉴"></button>
    </section>

    <!-- ================= 养成子界面（升级 / 升星 / 魔符 / 技能，先留空） ================= -->
    <section class="screen sub-screen hidden" id="subScreen">
      <div class="sub-box">
        <div class="sub-title" id="subTitle">升级</div>
        <div class="sub-hint" id="subHint">这个界面还没做，先留空</div>
        <button type="button" class="px-btn big" id="subBack">返 回</button>
      </div>
    </section>

    <!-- ================= 管理 ================= -->
    <!-- 整张「管理界面」当底图，一页三个角色窗口：全身图 + 头像名字 + 四个养成按钮 -->
    <section class="screen manage-screen hidden" id="manageScreen">
      <img class="manage-bg" src="./assets/manage.png" alt="管理">
      <div class="manage-grid" id="manageGrid"></div>
      <button type="button" class="m-arrow left" id="managePrev" aria-label="上一页"></button>
      <button type="button" class="m-arrow right" id="manageNext" aria-label="下一页"></button>
      <button type="button" class="px-btn manage-back" id="manageBack">返回</button>
    </section>

    <!-- ================= 角色选择（点 FIGHT 先进这里） ================= -->
    <!-- 上方三个大窗口放上场角色的全身图，下方长条横向滑动选头像 -->
    <section class="screen select-screen hidden" id="selectScreen">
      <img class="select-bg" src="./assets/select.png" alt="角色选择">
      <div class="select-grid" id="selectGrid"></div>
      <button type="button" class="m-arrow sel-arrow left" id="selPrev" aria-label="向左"></button>
      <button type="button" class="m-arrow sel-arrow right" id="selNext" aria-label="向右"></button>
      <button type="button" class="px-btn select-back" id="selBack">返回</button>

      <!-- 确认阵容弹窗 -->
      <div class="sel-confirm hidden" id="selConfirm">
        <div class="sel-confirm-box">
          <div class="sel-confirm-title">是否确定阵容</div>
          <div class="sel-confirm-team" id="selConfirmTeam"></div>
          <div class="sel-confirm-btns">
            <button type="button" class="px-btn big" id="selYes">是</button>
            <button type="button" class="px-btn big" id="selNo">否</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 战斗界面：离开战斗确认 -->
    <div class="px-confirm hidden" id="leaveConfirm">
      <div class="px-confirm-box">
        <div class="px-confirm-title">是否离开战斗？</div>
        <div class="px-confirm-btns">
          <button type="button" class="px-btn big" id="leaveYes">是</button>
          <button type="button" class="px-btn big" id="leaveNo">否</button>
        </div>
      </div>
    </div>

    <!-- ================= 升级（喂养果实） ================= -->
    <!-- 左：角色窗口（同管理界面）  右上：等级 + 喂养进度 + FEED  右下：商店 -->
    <section class="screen level-screen hidden" id="levelScreen">
      <img class="level-bg" src="./assets/level.png" alt="升级">
      <div class="level-grid" id="lvGrid"></div>
      <div class="lv-tip" id="lvTip"></div>
      <button type="button" class="px-btn level-back" id="lvBack">返回</button>
    </section>

    <!-- ================= 升星 ================= -->
    <!-- 左：角色窗口（同升级界面）  右上：星级 + USE  右中：金币/水晶  右下：水晶商店 -->
    <section class="screen star-screen hidden" id="starScreen">
      <img class="star-bg" src="./assets/star.png" alt="升星">
      <div class="star-grid" id="stGrid"></div>
      <div class="lv-tip" id="stTip"></div>
      <button type="button" class="px-btn star-back" id="stBack">返回</button>

      <!-- 升星确认弹窗 -->
      <div class="px-confirm hidden" id="stConfirm">
        <div class="px-confirm-box">
          <div class="px-confirm-title" id="stConfirmTitle">当前升星消耗 ? 水晶，是否继续</div>
          <div class="px-confirm-btns">
            <button type="button" class="px-btn big" id="stYes">是</button>
            <button type="button" class="px-btn big" id="stNo">否</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 技能 ================= -->
    <!-- 左：角色窗口  右上：选中技能说明  右下：三个元素技能（图标 + 6 格 + UP） -->
    <section class="screen skill-screen hidden" id="skillScreen">
      <img class="skill-bg" src="./assets/skill.png" alt="技能">
      <div class="skill-grid" id="skGrid"></div>
      <div class="lv-tip" id="skTip"></div>
      <button type="button" class="px-btn skill-back" id="skBack">返回</button>
    </section>

    <!-- ================= 魔符 ================= -->
    <!-- 左：角色窗口  右上：两个装备位 + 说明  下方：5x3 魔符库 -->
    <section class="screen rune-screen hidden" id="runeScreen">
      <img class="rune-bg" src="./assets/rune.png" alt="魔符">
      <div class="rune-grid-box" id="rnGrid"></div>
      <div class="lv-tip" id="rnTip"></div>
      <button type="button" class="px-btn rune-back" id="rnBack">返回</button>

      <!-- 魔符操作弹窗 -->
      <div class="px-confirm hidden" id="rnAction">
        <div class="px-confirm-box">
          <div class="px-confirm-title" id="rnActionTitle">要对其做什么操作</div>
          <div class="rn-action-icon" id="rnActionIcon"></div>
          <div class="px-confirm-btns">
            <button type="button" class="px-btn big" id="rnCombine">合成</button>
            <button type="button" class="px-btn big" id="rnEquipBtn">装备</button>
          </div>
          <div class="px-confirm-btns">
            <button type="button" class="px-btn" id="rnCancel">取消</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 图鉴 ================= -->
    <!-- 整张「图鉴界面」当底图，16 个窗口 + 左右翻页箭头压在上面 -->
    <section class="screen guide-screen hidden" id="guideScreen">
      <img class="guide-bg" src="./assets/guide.png" alt="图鉴">
      <div class="guide-grid" id="guideGrid"></div>
      <button type="button" class="guide-arrow" id="guidePrev" aria-label="上一页"></button>
      <button type="button" class="guide-arrow" id="guideNext" aria-label="下一页"></button>
      <button type="button" class="px-btn guide-back" id="guideBack">返回</button>
    </section>
  </div>
</div>

<div class="scanlines"></div>
<div id="rotateHint" class="rotate-hint">↻ 把手机横过来玩</div>

<noscript>
  <div class="boot">
    <div class="boot-title">龙之城重置</div>
    <div class="boot-sub">需要开启 JavaScript 才能进行对战</div>
  </div>
</noscript>

<script defer src="./src/data/elements.js?v=15"></script>
<script defer src="./src/data/statuses.js?v=15"></script>
<script defer src="./src/data/skills.js?v=15"></script>
<script defer src="./src/data/runes.js?v=15"></script>
<script defer src="./src/data/skills-level.js?v=15"></script>
<script defer src="./src/data/stats.js?v=15"></script>
<script defer src="./src/data/rune-fx.js?v=15"></script>
<script defer src="./src/data/stars.js?v=15"></script>
<script defer src="./src/data/curve.js?v=15"></script>
<script defer src="./src/platform/storage.js?v=15"></script>
<script defer src="./src/data/state.js?v=15"></script>
<script defer src="./src/data/characters.js?v=15"></script>
<script defer src="./src/data/guide.js?v=15"></script>
<script defer src="./src/ui/pixelart.js?v=15"></script>
<script defer src="./src/ui/audio.js?v=15"></script>
<script defer src="./src/ui/render.js?v=15"></script>
<script defer src="./src/ui/guide.js?v=15"></script>
<script defer src="./src/ui/manage.js?v=15"></script>
<script defer src="./src/ui/select.js?v=15"></script>
<script defer src="./src/ui/level.js?v=15"></script>
<script defer src="./src/ui/star.js?v=15"></script>
<script defer src="./src/ui/skill.js?v=15"></script>
<script defer src="./src/ui/runes.js?v=15"></script>
<script defer src="./src/engine/battle.js?v=15"></script>
<script defer src="./src/main.js?v=15"></script>
<!-- 网页版强制全屏增强：小工具版本（dist/index.html）不加载这一行 -->
<script defer src="./src/ui/fullscreen.js?v=15"></script>
</body>
</html>
